# cargo deny check: advisories, licenses, bans, sources.

[advisories]
ignore = [
    # rsa, through bergshamra-keys: the Marvin attack recovers a private key from decryption timing.
    # The proxy holds no RSA private key and only verifies SAML signatures with the IdP's public keys.
    { id = "RUSTSEC-2023-0071", reason = "public-key verification only; no RSA private key in the process" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The IronRDP crates come from the commit the browser client is built from (Cargo.toml).
allow-git = ["https://github.com/Devolutions/IronRDP"]
