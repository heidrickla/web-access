name: checks

# The forge's copy: its shared runner (capacity 1) has Linux labels only, and a job for a label no
# runner has waits a day before it is cancelled. Gitea reads this directory instead of .github/.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 15

      # shell: bash runs with pipefail, so a failed download fails the step instead of feeding sh nothing.
      - name: toolchain (pinned)
        timeout-minutes: 15
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.98.1 --component clippy,rustfmt
          "$HOME/.cargo/bin/rustc" --version | grep -F ' 1.98.1 '
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # target, kept between runs keyed on the toolchain and Cargo.lock. rust-cache drops the builds of
      # crates inside the workspace, and vendor/ is inside it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 10
        with:
          path: target
          key: ${{ runner.os }}-target-1.98.1-${{ hashFiles('Cargo.lock') }}

      # A release binary checked against its published digest, not a build on every push.
      - name: cargo-deny (pinned)
        timeout-minutes: 15
        run: |
          v=0.20.2
          d=cargo-deny-$v-x86_64-unknown-linux-musl
          curl -sSfL -o "$d.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$v/$d.tar.gz"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $d.tar.gz" | sha256sum -c -
          tar -xzf "$d.tar.gz" --strip-components=1 -C "$HOME/.cargo/bin" "$d/cargo-deny"

      - name: cargo-nextest (pinned)
        timeout-minutes: 15
        run: |
          n=cargo-nextest-0.9.146-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL -o "$n" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.146/$n"
          echo "b64617e8640624e8f9ba99819e37d7971154e97836d7ae4774fed4715501a6aa  $n" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nextest" && tar -xzf "$n" -C "$RUNNER_TEMP/nextest"
          install -m 755 "$(find "$RUNNER_TEMP/nextest" -type f -name cargo-nextest)" "$HOME/.cargo/bin/"
          cargo nextest --version

      - name: format
        timeout-minutes: 15
        run: cargo fmt --check

      - name: lint
        timeout-minutes: 15
        run: cargo clippy --offline --locked --all-targets -- -D warnings

      - name: test
        timeout-minutes: 15
        run: cargo nextest run --offline --locked

      - name: page scripts
        timeout-minutes: 15
        run: bash tests/js/run.sh

      - name: dependencies
        timeout-minutes: 15
        run: cargo deny check
