# cargo-about: the third-party licence notices served at /notices and installed by the MSI.
# The accepted list matches deny.toml's allow list.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-musl", "wasm32-unknown-unknown"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
