# web-access proxy configuration.
#
# Users, servers, groups and assignments are managed on the admin pages (https://<proxy>/admin), not
# here. This file holds what the proxy needs before anyone can sign in.

listen = "0.0.0.0:443"

# Accounts that are always administrators. Sign in as one of these to reach the admin pages.
admins = ["jdoe"]

# Where the database lives. Defaults to the directory holding this file.
# data_dir = 'C:\ProgramData\web-access'

# HTTPS. PEM files: the certificate chain for the name users browse to, and its private key.
# Without this section the listener speaks plain HTTP.
[https]
cert = 'C:\ProgramData\web-access\proxy-cert.pem'
key = 'C:\ProgramData\web-access\proxy-key.pem'

# How the proxy checks the RDP servers' own certificates.
#   "ca"       validate them against ca_bundle
#   "insecure" accept any certificate
# There is no default.
[tls]
verify = "ca"
ca_bundle = 'C:\ProgramData\web-access\server-ca.pem'

# The Active Directory users sign in against, over LDAPS.
[directory]
domain = "corp.example.com"
# With netbios set, sign-in binds as NETBIOS\user, which works whatever UPN suffix an account has.
netbios = "CORP"
# Domain controllers, tried in order.
urls = ["ldaps://dc1.corp.example.com", "ldaps://dc2.corp.example.com"]
# CA that issued the domain controllers' certificates. Omit to use the Windows certificate store.
ca_bundle = 'C:\ProgramData\web-access\directory-ca.pem'
# Optional read-only account. With it, the proxy checks usernames when an administrator adds them,
# and ends the sessions of accounts disabled in the directory. Its password is set on the admin
# Migration page or with `web-access-proxy.exe set-secret directory`, never in this file.
# service_account = "svc-webaccess"
# check_interval_secs = 600
