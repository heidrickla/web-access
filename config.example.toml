# web-access proxy configuration.
#
# Users, servers, groups and assignments are managed on the admin pages (https://<proxy>/admin), not
# here. This file holds what the proxy needs before anyone can sign in.

listen = "0.0.0.0:443"

# Accounts that are always administrators. Sign in as one of these to reach the admin pages.
admins = ["jdoe"]

# Local accounts, created with `web-access-proxy.exe local-account`, sign in with a password kept on
# this proxy instead of the directory. With this on, [directory] may be left out entirely.
# allow_local_accounts = true

# Where the database lives. Defaults to the directory holding this file.
# data_dir = 'C:\ProgramData\web-access'

# Connections served at once. A WebSocket counts until its RDP session is connected.
# max_connections = 1024

# Days the activity log keeps an entry.
# audit_days = 400

# HTTPS. PEM files: the certificate for the name users browse to followed by its chain, and its
# unencrypted private key. Without this section the listener speaks plain HTTP.
[https]
cert = 'C:\ProgramData\web-access\proxy-cert.pem'
key = 'C:\ProgramData\web-access\proxy-key.pem'

# How the proxy checks the RDP servers' own certificates.
#   "ca"       validate them against ca_bundle
#   "insecure" accept any certificate
# There is no default.
[tls]
verify = "ca"
ca_bundle = 'C:\ProgramData\web-access\server-ca.pem'

# The Active Directory users sign in against, over LDAPS.
[directory]
domain = "corp.example.com"
# The domain's NetBIOS name. A bare username binds as NETBIOS\user, which works whatever sign-in
# name an account has, and a password accepted for an account in another domain is refused.
netbios = "CORP"
# Domain controllers, tried in order.
urls = ["ldaps://dc1.corp.example.com", "ldaps://dc2.corp.example.com"]
# CA that issued the domain controllers' certificates. Omit to use the Windows certificate store.
ca_bundle = 'C:\ProgramData\web-access\directory-ca.pem'
# Where accounts are looked up. Derived from domain when omitted (DC=corp,DC=example,DC=com).
# base_dn = "OU=Staff,DC=corp,DC=example,DC=com"
# Seconds to wait for a domain controller.
# timeout_secs = 10
# Optional read-only account. With it, the proxy checks usernames when an administrator adds them,
# and ends the sessions of accounts disabled in the directory. Its password is set on the admin
# Migration page or with `web-access-proxy.exe set-secret directory`, never in this file.
# service_account = "svc-webaccess"
# check_interval_secs = 600

# Files crossing the clipboard channel, in both directions, are held on the proxy until scanned,
# and only files the scanner calls clean are passed on. Clipboard text is not scanned.
#   "amsi"    the anti-malware product registered with Windows (Trellix, Defender); the default on Windows
#   "command" a scanner program run on a copy of each file, its exit code the verdict
#   "off"     the clipboard channel is relayed unread
# The scanner is shown the EICAR test file and a harmless one at start and every check_every_mins,
# and every file is refused while the last check failed or is more than two checks old. Each check
# is one EICAR detection in the anti-malware product's own log.
[scan]
# scanner = "amsi"
# Seconds a file waits for its verdict before the transfer is refused.
# timeout_secs = 120
# Megabytes held for scanning at once, across every session.
# max_staged_mb = 2048
# check_every_mins = 60
# For the command scanner. {file} is replaced by the copy's path.
# command = ['C:\Program Files\Scanner\scan.exe', '/quiet', '{file}']
# clean_exit_codes = [0]
# detected_exit_codes = [1]

# Single sign-on through the site's SAML 2.0 identity provider (ADFS, Entra ID), beside the password
# sign-in. IT adds the proxy as a relying party from https://<proxy>/api/saml/metadata, signs the
# assertion, leaves it unencrypted, and sends the account's SID as an attribute. The proxy finds
# the account by that SID with the [directory] service_account, which this section requires.
# [saml]
# The address users open the proxy at.
# url = "https://access.corp.example.com"
# The identity provider's metadata, exported by IT. Read at start: restart the service after replacing it.
# idp_metadata = 'C:\ProgramData\web-access\idp-metadata.xml'
# The proxy's name at the identity provider. Default <url>/api/saml/metadata.
# entity_id = "https://access.corp.example.com/api/saml/metadata"
# The attribute carrying the SID. The default is ADFS's Primary SID claim; on Entra ID, IT maps a
# claim from user.onpremisessecurityidentifier and this names it.
# sid_attribute = "http://schemas.microsoft.com/ws/2008/06/identity/claims/primarysid"
# Seconds of clock difference allowed between the proxy and the identity provider, at most 300.
# clock_skew_secs = 180
