<!DOCTYPE html>
<!--
  No inline <style> or <script>. The proxy serves a strict Content-Security-Policy, and
  `default-src 'self'` with `script-src 'self'` forbids both. Inlining them produced an unstyled page
  stuck on "loading", with the failure visible only in the console. Measured 2026-09-23.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>web-access</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<header>
  <h1>web-access</h1>
  <button id="back" hidden>Disconnect</button>
  <span id="status">loading</span>
</header>
<main>
  <div id="tiles"></div>
  <canvas id="screen" width="1280" height="800" tabindex="0"></canvas>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
