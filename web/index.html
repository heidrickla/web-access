<!DOCTYPE html>
<!--
  No inline <style> or <script>. The proxy serves a strict Content-Security-Policy, and
  `default-src 'self'` with `script-src 'self'` forbids both. Inlining them produced an unstyled page
  stuck on "loading", with the failure visible only in the console. Measured 2026-09-23.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>web-access</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<header>
  <h1>web-access</h1>
  <button id="back" hidden>Disconnect</button>
  <span id="status">loading</span>
</header>
<main>
  <div id="tiles"></div>
  <canvas id="screen" width="1280" height="800" tabindex="0"></canvas>
</main>

<!-- Session controls. Dim rail at the left edge while a session is up; click to expand. -->
<aside id="rail" hidden>
  <button id="rail-toggle" class="rail-btn" title="Session options" aria-label="Session options" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L14.9 3h-3.8l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.8 7.8 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1l.4 2.6h3.8l.4-2.6c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4zM13 15.2A3.2 3.2 0 1 1 13 8.8a3.2 3.2 0 0 1 0 6.4z"/></svg>
  </button>
  <div id="panel">
    <header class="panel-head">
      <span id="panel-target">session</span>
      <button id="panel-close" class="rail-btn" title="Collapse" aria-label="Collapse">&#171;</button>
    </header>

    <section>
      <h3>Clipboard</h3>
      <textarea id="clip" rows="5" spellcheck="false" placeholder="Text copied on the remote appears here. Type or paste here and send it across."></textarea>
      <div class="row">
        <button id="clip-send">Send to remote</button>
        <button id="clip-copy" class="ghost">Copy</button>
      </div>
      <p class="note" id="files-note"></p>
    </section>

    <section>
      <h3>Keys</h3>
      <div class="row">
        <button id="send-cad">Ctrl + Alt + Del</button>
        <button id="fullscreen" class="ghost">Fullscreen</button>
      </div>
    </section>

    <section>
      <h3>Session</h3>
      <p class="note" id="panel-info"></p>
      <button id="panel-disconnect" class="danger">Disconnect</button>
    </section>
  </div>
</aside>

<!--
  Credentials are asked for AFTER a system is chosen, not before. IronRDP requires a username to
  connect at all — omitting it fails with "username missing" — so there is no path where the target's
  own login screen appears instead. Cloudflare's browser RDP prompts for the same reason.
-->
<dialog id="signin">
  <form method="dialog" id="signin-form">
    <h2 id="signin-title">Sign in</h2>
    <label>Username<input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Password<input id="p" type="password" autocomplete="current-password"></label>
    <label>Domain <span class="hint">optional</span><input id="d" autocapitalize="none" spellcheck="false"></label>
    <div class="actions">
      <!-- formnovalidate, or `required` on the username blocks Cancel from closing the dialog. -->
      <button value="cancel" type="submit" class="ghost" formnovalidate>Cancel</button>
      <button value="go" type="submit" id="signin-go" class="primary">Connect</button>
    </div>
  </form>
</dialog>
<script type="module" src="./app.js"></script>
</body>
</html>
